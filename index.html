<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="As peças que a nossa impressora 3D já fez.">
<title>Cantinho dos Moxis – As criações da nossa impressora 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f2f4f0;--surface:#fff;--ink:#16211d;--muted:#55635d;--line:#d5dcd6;--accent:#0b7f7a;--accent-ink:#fff;--stripe:rgba(22,33,29,.07);--shade:rgba(0,0,0,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--surface:#18201d;--ink:#e9efeb;--muted:#9aa9a2;--line:#2b3731;--accent:#3cc7c0;--accent-ink:#06201e;--stripe:rgba(233,239,235,.06);--shade:rgba(0,0,0,.35);color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
.hero{position:relative;padding:4.5rem 0 3.5rem;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 11px,var(--stripe) 11px 12px);-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%)}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2.6rem,9vw,5.6rem);font-weight:800;letter-spacing:-.03em;max-width:12ch}
.hero p{max-width:46ch;color:var(--muted);font-size:1.15rem;margin:1.25rem 0 0}
.stats{display:flex;flex-wrap:wrap;gap:.5rem 2rem;margin:2rem 0 0;padding:0;list-style:none;font-weight:600}
.stats span{color:var(--muted);font-weight:400}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;padding:2rem 0 1.25rem}
.bar button{font:inherit;font-weight:600;font-size:.95rem;padding:.55rem 1.05rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.25rem;padding:0 0 4rem;margin:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;width:100%;padding:0;font:inherit;color:inherit;cursor:pointer}
.card:hover .obj{transform:translateY(-4px)}
.stage{aspect-ratio:4/3;display:grid;place-items:center;background:repeating-linear-gradient(to bottom,transparent 0 7px,var(--stripe) 7px 8px),linear-gradient(var(--bg),var(--surface));border-bottom:1px solid var(--line);overflow:hidden}
.stage{position:relative}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.obj{width:46%;aspect-ratio:1;background:var(--c);position:relative;transition:transform .25s ease;filter:drop-shadow(0 10px 8px var(--shade))}
.obj::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 5px,rgba(0,0,0,.14) 5px 6px)}
.s-vaso{clip-path:polygon(30% 0,70% 0,64% 22%,92% 55%,70% 100%,30% 100%,8% 55%,36% 22%)}
.s-cubo{clip-path:polygon(0 12%,12% 0,100% 0,100% 88%,88% 100%,0 100%)}
.s-torre{width:30%;aspect-ratio:1/1.5;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.s-disco{clip-path:circle(50%)}
.s-hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.s-estrela{clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 98%,50% 76%,20% 98%,30% 60%,0 38%,38% 36%)}
.info{padding:1rem 1.1rem 1.2rem}
.info h3{font-size:1.25rem;font-weight:600;margin-bottom:.25rem}
.info p{margin:0;color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:.4rem}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,calc(100% - 2rem));max-height:calc(100% - 2rem);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .stage{aspect-ratio:16/10}
dialog .body{padding:1.25rem 1.4rem 1.5rem}
dialog h2{font-size:1.8rem;margin-bottom:.5rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.25rem;margin:1rem 0 1.25rem}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
.close{font:inherit;font-weight:600;padding:.6rem 1.2rem;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.price{font:800 1.15rem "Bricolage Grotesque",Figtree,system-ui,sans-serif;white-space:nowrap}
.bar select{font:inherit;font-weight:600;font-size:.95rem;padding:.55rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
.vazio{color:var(--muted);padding:2rem 0 4rem}
footer{border-top:1px solid var(--line);padding:2rem 0 3rem;color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.obj{transition:none}}
.grid li{display:flex}
.card{height:100%}
.info{flex:1;display:flex;flex-direction:column}
.meta{margin-top:auto}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Cantinho dos Moxis</h1>
    <p>As peças que a nossa impressora 3D já fez: úteis, divertidas e algumas só para ver se resultava.</p>
    <ul class="stats" id="stats"></ul>
  </div>
</header>
<main class="wrap">
  <div class="bar" role="group" aria-label="Filtrar por categoria" id="filters"></div>
  <ul class="grid" id="grid"></ul>
</main>
<dialog id="dlg" aria-labelledby="dt">
  <div class="stage" id="dstage"></div>
  <div class="body">
    <h2 id="dt"></h2>
    <p id="dd" style="margin:0;color:var(--muted)"></p>
    <dl id="dl"></dl>
    <button class="close" id="close">Fechar</button>
  </div>
</dialog>
<footer><div class="wrap">Feito com filamento, paciência e muitas horas de impressão.</div></footer>

<!-- As peças estão no ficheiro pecas.js -->
<script src="pecas.js"></script>
<script>
const PECAS=window.PECAS||[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cats=["Todas",...new Set(PECAS.map(p=>p.cat).filter(Boolean))];
let ativa="Todas",mat="Todos";
const materiais=[...new Set(PECAS.map(p=>p.material).filter(Boolean))];
const preco=p=>typeof p.preco==="number"?new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(p.preco):"";

function stage(p){
  return p.foto
    ? `<div class="stage"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy"></div>`
    : `<div class="stage"><div class="obj s-${esc(p.forma||"cubo")}" style="--c:${esc(p.cor||"#0b7f7a")}"></div></div>`;
}
function desenhar(){
  const lista=PECAS.map((p,i)=>({p,i})).filter(x=>(ativa==="Todas"||x.p.cat===ativa)&&(mat==="Todos"||x.p.material===mat));
  $("#grid").innerHTML=lista.length?lista.map(({p,i})=>`<li><button class="card" data-i="${i}" aria-label="Ver detalhes: ${esc(p.nome)}">${stage(p)}<div class="info"><span class="tag">${esc(p.cat)}</span><h3>${esc(p.nome)}</h3><div class="meta"><p>${esc(p.material)}</p><span class="price">${esc(preco(p))}</span></div></div></button></li>`).join(""):`<li class="vazio">Ainda não há peças. Adiciona a primeira no ficheiro pecas.js.</li>`;
}
function filtros(){const b=cats.length>2?cats.map(c=>`<button type="button" aria-pressed="${c===ativa}">${esc(c)}</button>`).join(""):"";const s=materiais.length>1?`<select id="mat" aria-label="Filtrar por material"><option value="Todos">Todos os materiais</option>${materiais.map(m=>`<option value="${esc(m)}"${m===mat?" selected":""}>${esc(m)}</option>`).join("")}</select>`:"";$("#filters").innerHTML=b+s}
$("#filters").addEventListener("change",e=>{if(e.target.id==="mat"){mat=e.target.value;desenhar()}});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ativa=b.textContent;filtros();desenhar()});
$("#grid").addEventListener("click",e=>{
  const b=e.target.closest(".card");if(!b)return;
  const p=PECAS[b.dataset.i];
  $("#dstage").outerHTML=stage(p).replace('class="stage"','class="stage" id="dstage"');
  $("#dt").textContent=p.nome;$("#dd").textContent=p.desc||"";
  const linhas=[["Preço",preco(p)],["Categoria",p.cat],["Material",p.material],["Altura da camada",p.camada],["Tempo de impressão",p.tempo]].filter(l=>l[1]);
  $("#dl").innerHTML=linhas.map(l=>`<dt>${l[0]}</dt><dd>${esc(l[1])}</dd>`).join("");
  $("#dlg").showModal();
});
$("#close").addEventListener("click",()=>$("#dlg").close());
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
const mats=new Set(PECAS.map(p=>(p.material||"").split(" ")[0]).filter(Boolean)).size;
$("#stats").innerHTML=`<li>${PECAS.length} <span>peças</span></li><li>${cats.length-1} <span>categorias</span></li><li>${mats} <span>materiais</span></li>`;
filtros();desenhar();
</script>
</body>
</html>
